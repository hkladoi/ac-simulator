map $http_x_forwarded_proto $forwarded_proto { default $http_x_forwarded_proto; "" $scheme; }
server { listen 8080; server_name _; root /usr/share/nginx/html; index index.html; add_header X-Content-Type-Options nosniff always; add_header Referrer-Policy no-referrer always; add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always; add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'" always; location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; } location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $forwarded_proto; proxy_set_header X-Request-ID $request_id; } location /health/ { proxy_pass http://api:8080; } location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; } }
