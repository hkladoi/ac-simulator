name: release
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment (configure required reviewers for production)
        required: true
        type: choice
        options: [staging, production]
permissions:
  contents: read
  packages: write
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false
jobs:
  verify-build-publish:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - run: dotnet test apps/api/tests/IntegrationTests/IntegrationTests.csproj -c Release
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ github.sha }}
      - name: Request platform deployment of immutable image digests
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: >-
          curl --fail --silent --show-error -X POST
          -H 'Content-Type: application/json'
          -d "{\"environment\":\"${TARGET_ENVIRONMENT}\",\"commit\":\"${GITHUB_SHA}\",\"apiImage\":\"ghcr.io/${GITHUB_REPOSITORY}/api:${GITHUB_SHA}\",\"webImage\":\"ghcr.io/${GITHUB_REPOSITORY}/web:${GITHUB_SHA}\"}"
          "$DEPLOY_WEBHOOK_URL"
      - name: Production-shaped health smoke
        env: { BASE_URL: '${{ vars.BASE_URL }}' }
        run: curl --fail --retry 12 --retry-delay 10 --retry-all-errors "$BASE_URL/health/ready"
